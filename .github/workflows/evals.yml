name: Live evals

# SPEC §13.3: the live tier is normally run by AgentForge through the eval adapter. This manual
# workflow runs the same 30 case.v1 scenarios against real Gemini/Groq for a quick check.
# Needs repo secrets GEMINI_API_KEY (and optionally GROQ_API_KEY). ~150 LLM calls per run —
# Groq limits are shared with DataPilot and AgentForge, so it is manual-only (no nightly schedule).
on:
  workflow_dispatch:
    inputs:
      budget_calls:
        description: "Stop after this many LLM calls"
        default: "250"

jobs:
  live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: eval }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      EVAL_DATABASE_URL: postgresql://postgres:pw@localhost:5432/eval
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip without keys
        if: ${{ env.GEMINI_API_KEY == '' && env.GROQ_API_KEY == '' }}
        run: echo "::notice::Add GEMINI_API_KEY (and GROQ_API_KEY) as repository secrets to run live evals."
      - uses: astral-sh/setup-uv@v7
        if: ${{ env.GEMINI_API_KEY != '' || env.GROQ_API_KEY != '' }}
      - name: Run live evals through the eval adapter
        if: ${{ env.GEMINI_API_KEY != '' || env.GROQ_API_KEY != '' }}
        working-directory: backend
        run: |
          uv sync --frozen
          mkdir -p ../evals/reports && uv run python ../evals/build_cases.py
          uv run python -m returnpilot.eval_adapter run --cases ../evals/scenarios.jsonl \
            --profile profiles/default.json --out ../evals/reports/live.jsonl --check \
            --budget-calls ${{ inputs.budget_calls }} || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-results, path: evals/reports, if-no-files-found: ignore }
