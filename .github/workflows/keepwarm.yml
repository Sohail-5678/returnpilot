name: Keep demo warm

# Render's free web service sleeps after 15 idle minutes (first request then takes ~60 s).
# During US daytime (13:00–03:00 UTC) this pings the site every ~10 minutes so recruiters land on
# a warm demo. ~14 h/day ≈ 430 of Render's 750 free hours a month. Disable the workflow to stop.
on:
  schedule:
    - cron: "*/10 13-23 * * *"
    - cron: "*/10 0-2 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Sohail-5678/returnpilot' }}
    steps:
      - run: curl -fsS -m 120 https://returnpilot-ai-api.onrender.com/healthz || true
