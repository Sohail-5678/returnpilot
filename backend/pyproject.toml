[project]
name = "returnpilot"
version = "0.1.0"
description = "ReturnPilot backend: LangGraph agent, MCP commerce server, policy engine, Celery jobs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "sqlalchemy[asyncio]>=2.1",
  "alembic>=1.20",
  "psycopg[binary,pool]>=3.3",
  "pgvector>=0.5",
  "langgraph>=1.2",
  "langgraph-checkpoint-postgres>=3.1",
  "langchain-core>=1.6",
  "langchain-groq>=1.1",
  "langchain-google-genai>=4.4",
  "langchain-mcp-adapters>=0.3.2",
  "mcp>=1.24,<2",
  "celery[redis]>=5.6",
  "redis>=5,<6.5",
  "honcho>=2.0",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "pyjwt[crypto]>=2.15",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "faker>=40",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=6",
  "ruff>=0.16",
  "mypy>=2.4",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["returnpilot"]

[tool.pytest.ini_options]
testpaths = ["returnpilot/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
